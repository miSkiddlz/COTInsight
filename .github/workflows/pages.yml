name: Update data and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily check, including weekends/holiday delays. UTC; scheduling is best effort.
    - cron: '17 22 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test data processing
        run: python -m unittest discover -s tests -v
      - name: Download and validate official CFTC data
        run: python scripts/fetch_cot_api.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
